version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: franco-afyeev_server_1
      APP_PORT: 8000
  init_data:
    image: ghcr.io/francocorreasosa/afyeev-charger@sha256:97e6ca72605fd3a53e15200c3feaafbdf7d56e14651071780433b0f4aa1fe7c3
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /data && chmod 700 /data"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    restart: "no"
  server:
    # Release tooling replaces this with a public image pinned by digest.
    image: ghcr.io/francocorreasosa/afyeev-charger@sha256:97e6ca72605fd3a53e15200c3feaafbdf7d56e14651071780433b0f4aa1fe7c3
    user: "1000:1000"
    init: true
    restart: on-failure
    depends_on:
      init_data:
        condition: service_completed_successfully
    stop_grace_period: 30s
    environment:
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: franco-tempsensing_web_1
      APP_PORT: 8080
  init_data:
    image: ghcr.io/francocorreasosa/umbrel-tempsensing:0.1.3
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data && chmod -R u+rwX,g+rwX /data"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
    restart: "no"
  web:
    image: ghcr.io/francocorreasosa/umbrel-tempsensing:0.1.3
    init: true
    restart: on-failure
    depends_on:
      init_data:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  collector:
    image: ghcr.io/francocorreasosa/umbrel-tempsensing:0.1.3
    command: ["python", "-m", "tempsensing.collector"]
    # BlueZ's system-bus policy typically authorizes root. No privileged mode,
    # host filesystem or Docker socket; only this worker gets D-Bus access.
    user: "0:1000"
    init: true
    restart: on-failure
    network_mode: host
    depends_on:
      init_data:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /run/dbus:/run/dbus:ro
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Share SQLite ownership with the unprivileged web process.
    entrypoint: ["sh", "-c", "umask 002; exec python -m tempsensing.collector"]

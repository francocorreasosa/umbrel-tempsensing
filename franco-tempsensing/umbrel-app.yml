manifestVersion: 1
id: franco-tempsensing
name: Tempsensing
tagline: El historial de temperatura y humedad de tu casa
icon: https://raw.githubusercontent.com/francocorreasosa/umbrel-tempsensing/main/tempsensing/static/icon.svg
category: automation
version: "0.1.2"
port: 8765
description: >-
  Consultá tus sensores Xiaomi LYWSD03MMC por Bluetooth y guardá las mediciones
  en tu Umbrel. Gráficos de temperatura y humedad, nombres por ambiente,
  intervalo configurable y exportación CSV. Historial local de 365 días.


  Requiere Bluetooth habilitado en el equipo y sensores dentro de su alcance.
  Compatible con firmware que exponga las mediciones por notificaciones GATT.
  Descubrí y activá los sensores desde la interfaz después de instalar.
developer: Franco Correa
